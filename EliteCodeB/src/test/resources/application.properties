spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:elitecode_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

security.jwt.secret=elitecode-test-secret-elitecode-test-secret-32

elitecode.jwt.secret=elitecode-test-secret-elitecode-test-secret-32
elitecode.jwt.expiration-ms=3600000
elitecode.jwt.refresh-expiration-ms=604800000

spring.mail.username=test@localhost

openrouter.api.key=test-openrouter-key
